name: Build Cave APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decompresser et compiler l'APK
        run: |
          for z in *.zip; do unzip -o "$z" -x ".github/*"; done
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Cave.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cave-APK
          path: Cave.apk
          
