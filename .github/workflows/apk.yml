name: Build Cave APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer et compiler l'APK
        shell: bash
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -x ".github/*"
          done
          if [ ! -f www/index.html ]; then
            mkdir -p www
            for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
              [ -f "$f" ] && cp "$f" www/
            done
          fi
          if [ ! -f www/index.html ]; then
            echo "ERREUR: index.html introuvable"
            ls -la
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo '{"name":"cave-sommelier-app","version":"1.56.0","private":true,"dependencies":{"@capacitor/core":"6.1.0","@capacitor/android":"6.1.0"},"devDependencies":{"@capacitor/cli":"6.1.0"}}' > package.json
          fi
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"be.cave.sommelier","appName":"Cave","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          fi
          rm -rf android
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Cave.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cave-APK
          path: Cave.apk
          
